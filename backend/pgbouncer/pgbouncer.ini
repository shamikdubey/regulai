[databases]
; Route all connections through PgBouncer to the Postgres backend
; In production: replace localhost with your RDS endpoint
regulai = host=postgres port=5432 dbname=regulai user=regulai_app

[pgbouncer]
; ── Network ──────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432
; UNIX socket for same-host connections (faster)
unix_socket_dir = /tmp

; ── Pool mode ─────────────────────────────────────────────────────────────────
; transaction mode: connection returned to pool after each transaction
; This is the most efficient mode and works with async frameworks
; NOTE: SET commands are NOT preserved across transactions in this mode
; We use SET LOCAL (transaction-scoped) so this is fine for RLS
pool_mode = transaction

; ── Pool sizing ───────────────────────────────────────────────────────────────
; Postgres max_connections is typically 100-200
; PgBouncer acts as a multiplexer: many app connections → few Postgres connections

; Max Postgres connections from PgBouncer
max_client_conn = 1000          ; Max connections from apps TO PgBouncer
default_pool_size = 25          ; Postgres connections per database+user pair
min_pool_size = 5               ; Keep minimum connections warm
reserve_pool_size = 5           ; Emergency reserve connections
reserve_pool_timeout = 5.0      ; Seconds to wait before using reserve

; ── Timeouts ──────────────────────────────────────────────────────────────────
server_connect_timeout = 15     ; Time to wait for Postgres connection
server_idle_timeout = 600       ; Close idle Postgres connections after 10 min
client_idle_timeout = 0         ; Don't close idle client connections
query_timeout = 30              ; Kill queries running > 30 seconds
client_login_timeout = 10       ; Auth timeout

; ── Authentication ────────────────────────────────────────────────────────────
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; ── Logging ───────────────────────────────────────────────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; ── Admin ─────────────────────────────────────────────────────────────────────
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
