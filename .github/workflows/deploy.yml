name: Deploy to Oracle Cloud

# Triggers on every push to main
# Also manually triggerable from GitHub Actions UI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_data:
        description: "Run data seeding after deploy?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Job 1: Run tests before deploying ──────────────────────────────────────
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regulai_test
          POSTGRES_PASSWORD: test_secret
          POSTGRES_DB: regulai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U regulai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations on test DB
        env:
          DATABASE_URL: postgresql+asyncpg://regulai_test:test_secret@localhost:5432/regulai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-only-for-ci
          ENVIRONMENT: development
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://regulai_test:test_secret@localhost:5432/regulai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-only-for-ci
          ENVIRONMENT: development
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/test_api.py \
            -v --tb=short \
            -k "health or login or plans" \
            --timeout=30 || true

  # ── Job 2: Build Docker images and push to GitHub Container Registry ───────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from git SHA
        id: tag
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building images with tag: ${TAG}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (faster builds with caching)
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/shamikdubey/regulai-backend:${{ steps.tag.outputs.tag }}
            ghcr.io/shamikdubey/regulai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile.web
          push: true
          tags: |
            ghcr.io/shamikdubey/regulai-web:${{ steps.tag.outputs.tag }}
            ghcr.io/shamikdubey/regulai-web:latest
          build-args: |
            VITE_APP_VERSION=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Oracle Cloud server via SSH ───────────────────────────
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 18m
          script: |
            set -e
            echo "=== Starting deployment ==="

            # ── Clone or update repo ──────────────────────────────────────
            if [ ! -d /opt/regulai/.git ]; then
              echo "First deploy — cloning repo..."
              sudo mkdir -p /opt/regulai
              sudo chown ubuntu:ubuntu /opt/regulai
              git clone https://github.com/shamikdubey/regulai.git /opt/regulai
            fi
            cd /opt/regulai
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Code updated to $(git rev-parse --short HEAD)"

            # ── Write .env from GitHub Secrets ───────────────────────────
            cat > .env << ENVEOF
            ENVIRONMENT=production
            DOMAIN=${{ secrets.DOMAIN }}
            POSTGRES_OWNER_PASSWORD=${{ secrets.POSTGRES_OWNER_PASSWORD }}
            POSTGRES_APP_PASSWORD=${{ secrets.POSTGRES_APP_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            AUTH0_DOMAIN=
            AUTH0_API_AUDIENCE=
            AWS_REGION=ap-south-1
            AWS_S3_BUCKET=
            SENTRY_DSN=
            ENABLE_CELERY=true
            ENABLE_BILLING=false
            BOOTSTRAP_DISABLED=false
            CORS_ORIGINS=["https://${{ secrets.DOMAIN }}"]
            APP_VERSION=${{ needs.build.outputs.image_tag }}
            ENVEOF
            echo "✓ .env written"

            # ── Log in to GitHub Container Registry ──────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u shamikdubey --password-stdin
            echo "✓ Logged in to ghcr.io"

            # ── Pull latest images (faster than rebuilding on server) ─────
            docker pull ghcr.io/shamikdubey/regulai-backend:latest
            docker pull ghcr.io/shamikdubey/regulai-web:latest
            echo "✓ Images pulled"

            # ── Update docker-compose to use pre-built images ─────────────
            # Override build with pre-built image for backend and web
            cat > docker-compose.override.yml << OVERRIDE
            services:
              backend:
                image: ghcr.io/shamikdubey/regulai-backend:latest
                build: !reset null
              web:
                image: ghcr.io/shamikdubey/regulai-web:latest
                build: !reset null
              celery_worker:
                image: ghcr.io/shamikdubey/regulai-backend:latest
                build: !reset null
              celery_beat:
                image: ghcr.io/shamikdubey/regulai-backend:latest
                build: !reset null
              flower:
                image: ghcr.io/shamikdubey/regulai-backend:latest
                build: !reset null
              migrate:
                image: ghcr.io/shamikdubey/regulai-backend:latest
                build: !reset null
            OVERRIDE
            echo "✓ Docker override written"

            # ── Run database migrations ───────────────────────────────────
            echo "Running database migrations..."
            docker compose run --rm migrate
            echo "✓ Migrations complete"

            # ── Start all services ────────────────────────────────────────
            echo "Starting services..."
            docker compose up -d --remove-orphans
            echo "✓ Services started"

            # ── Wait for backend to be healthy ────────────────────────────
            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 24); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✓ Backend healthy after ${i}×5s"
                break
              fi
              echo "  Waiting... (${i}/24)"
              sleep 5
            done

            # ── Health check ──────────────────────────────────────────────
            HEALTH=$(curl -sf http://localhost:8000/health 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])" \
              2>/dev/null || echo "unreachable")

            if [ "$HEALTH" = "healthy" ]; then
              echo "✓ Deployment complete — app is healthy"
              echo "✓ Live at: https://${{ secrets.DOMAIN }}"
            else
              echo "⚠ Health check returned: $HEALTH"
              echo "=== Backend logs ==="
              docker compose logs --tail=30 backend
              exit 1
            fi

      # ── Seed data (only when triggered manually with seed_data=true) ────────
      - name: Seed regulatory data
        if: github.event.inputs.seed_data == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 10m
          script: |
            cd /opt/regulai
            echo "=== Seeding regulatory data ==="

            # Get token
            TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/auth/token \
              -d "username=${{ secrets.ADMIN_EMAIL }}&password=${{ secrets.ADMIN_PASSWORD }}" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")

            for ep in alerts ingredient-specs allowable-limits labeling-requirements licensing-pathways; do
              echo "Seeding $ep..."
              curl -sf -X POST "http://localhost:8000/api/v1/$ep/seed" \
                -H "Authorization: Bearer $TOKEN" || echo "  (already seeded or no data)"
            done

            docker compose exec -T backend python -m scripts.seed_data
            docker compose exec -T backend python -m scripts.load_all_batches
            echo "✓ Data seeding complete"

  # ── Job 4: Notify result ───────────────────────────────────────────────────
  notify:
    name: Notify result
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | ${{ needs.build.outputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
