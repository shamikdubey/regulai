name: RegulAI CI — Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regulai_test
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: regulai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://regulai_test:testpass123@localhost:5432/regulai_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-real-32chars
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      ENABLE_CELERY: "false"
      ENABLE_BILLING: "false"
      BOOTSTRAP_DISABLED: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run test suite
        working-directory: backend
        run: |
          pytest tests/test_api.py -v \
            --tb=short \
            --timeout=30 \
            -x

  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build for production
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_API_URL: ""
