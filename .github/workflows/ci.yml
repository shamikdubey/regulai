name: RegulAI CI — Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: regulai_test
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: regulai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://regulai_test:testpass123@localhost:5432/regulai_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-32-characters-xx
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      ENABLE_CELERY: "false"
      ENABLE_BILLING: "false"
      BOOTSTRAP_DISABLED: "false"
      AWS_REGION: "ap-south-1"
      AWS_S3_BUCKET: ""
      SENTRY_DSN: ""
      OTEL_ENDPOINT: ""
      TESTING: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev build-essential

      - name: Install Python packages
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        working-directory: backend
        run: |
          pytest tests/test_api.py -v --tb=short -x --timeout=30

  # ── Frontend Build ─────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: web
        run: npm install --ignore-scripts

      - name: TypeScript check
        working-directory: web
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_API_URL: ""
